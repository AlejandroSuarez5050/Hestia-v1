services:
  bot:
    container_name: hestia
    image: ghcr.io/<owner>/<repo>:latest
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - hestia-network
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lavalink:
    container_name: hestia-lavalink
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    networks:
      - hestia-network
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-change-me}
      - SPOTIFY_ENABLED=${SPOTIFY_ENABLED:-false}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hestia-network:
    name: hestia_network

# Dev tip:
# - Para ambiente dev, usa la imagen ghcr.io/<owner>/<repo>:dev
